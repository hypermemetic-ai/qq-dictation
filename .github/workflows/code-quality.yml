name: "code quality"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "ops/**"
      - "tests/**"
      - "docs/**"
      - "tools/check.sh"
      - "README.md"
      - "package.json"
      - "bun.lock"
      - "eslint.config.*"
      - ".prettierignore"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "ops/**"
      - "tests/**"
      - "docs/**"
      - "tools/check.sh"
      - "README.md"
      - "package.json"
      - "bun.lock"
      - "eslint.config.*"
      - ".prettierignore"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Run prettier and rustfmt
        run: bun run format:check
